<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher OS | المنصة التعليمية المتكاملة</title>
    <meta http-equiv="refresh" content="0; url=client/">
    <link rel="icon" type="image/svg+xml" href="client/icons/icon-192.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #F8FAFC;
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            direction: rtl;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #E2E8F0;
        }
        .logo {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            color: #1E293B;
        }
        p {
            color: #64748B;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: #2563EB;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #1D4ED8;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⚡</div>
        <h1>منصة TEACHER OS</h1>
        <p>جاري تحويلك تلقائياً إلى واجهة المنصة التعليمية الموحدة...</p>
        <a href="client/" class="btn">اضغط هنا للدخول فوراً ➔</a>
    </div>
    <script>
        window.location.replace("client/");
    </script>
</body>
</html>
